# media-sync self-hosted deployment template (personal use; trusted networks only).
#
#   cp docker-compose.example.yml docker-compose.yml
#   docker compose up -d --build
#   open http://127.0.0.1:8632/
#
# Keep YOUR docker-compose.yml local: it is git-ignored so upstream updates
# never conflict with your deployment configuration. The API/console has NO
# authentication: the port is published to the host loopback by default.
# Change "127.0.0.1:8632:8632" only on trusted LANs.

services:
  media-sync:
    build:
      context: .
      # Mainland-China mirror defaults (Aliyun apt + pip PyPI mirror +
      # npmmirror npm packages/Playwright binaries). PYPI_INDEX applies to pip steps only —
      # uv always validates the committed lock against pypi.org, so keep
      # BUILD_HTTPS_PROXY handy if that is slow. Building outside mainland
      # China? Delete these four mirror lines.
      args:
        APT_MIRROR: mirrors.aliyun.com
        PYPI_INDEX: https://mirrors.aliyun.com/pypi/simple/
        NPM_REGISTRY: https://registry.npmmirror.com
        PLAYWRIGHT_DOWNLOAD_HOST: https://registry.npmmirror.com/-/binary/playwright
        # RC builds: pin the base image by digest and the build manifest
        # records it.  docker buildx imagetools inspect python:3.13-slim-bookworm
        # then:  export BASE_IMAGE=python:3.13-slim-bookworm@sha256:<digest>
        BASE_IMAGE: ${BASE_IMAGE:-python:3.13-slim-bookworm}
    image: media-sync:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8632:8632"
    environment:
      MEDIA_SYNC_LIBRARY_INSPECTION_MAX_BYTES: 1073741824
      MEDIA_SYNC_LIBRARY_INSPECTION_DEADLINE_SECONDS: 10
      # Optional media-server control: uncomment ALL six selectors together,
      # review every allowed DNS answer/CIDR, then explicitly open the gate.
      # MEDIA_SYNC_MEDIA_SERVER_PROVIDER: emby
      # MEDIA_SYNC_MEDIA_SERVER_BASE_URL: https://media.example.internal:8920
      # MEDIA_SYNC_MEDIA_SERVER_LIBRARY_ID: replace-with-fixed-library-item-id
      # MEDIA_SYNC_MEDIA_SERVER_API_KEY_SECRET_REF: env:MEDIA_SYNC_MEDIA_SERVER_API_KEY
      # MEDIA_SYNC_MEDIA_SERVER_LIBRARY_PATH: /srv/media-sync/data/library
      # MEDIA_SYNC_MEDIA_SERVER_ALLOWED_CIDRS: 10.20.0.0/16,fd00:20::/64
      # MEDIA_SYNC_MEDIA_SERVER_VERIFY_TLS: "true"
      # MEDIA_SYNC_MEDIA_SERVER_TIMEOUT_SECONDS: 10
      # MEDIA_SYNC_MEDIA_SERVER_OPERATIONS_ENABLED: "false"
      # MEDIA_SYNC_MEDIA_SERVER_API_KEY: ${MEDIA_SYNC_MEDIA_SERVER_API_KEY:?set-in-shell}
    volumes:
      - media-sync-data:/data
      # To hand /data/library to a host Emby/Jellyfin, prefer an explicit bind
      # mount instead of the named volume, e.g.  - /srv/media-sync/data:/data
      # then point the media server at /srv/media-sync/data/library (read-only).
      # IMPORTANT: switching to a bind mount requires applying the SAME mount
      # to the supervisor service below (and chown-ing the host dir to UID
      # 1000), or the two services will see different data.
    shm_size: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8632/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Optional resident chain: keeps due subscriptions ticking and drains the
  # download/Emby pipeline without manual web-console clicks. It shares the
  # same data volume and runs the execution-0012 foreground supervisor with
  # the MediaCrawler gates explicitly enabled (license acknowledged for this
  # personal deployment by enabling this service).
  supervisor:
    image: media-sync:local
    restart: unless-stopped
    depends_on:
      media-sync:
        condition: service_healthy
    volumes:
      - media-sync-data:/data
    shm_size: 1g
    environment:
      MEDIA_SYNC_STATE_DIR: /data/state
      MEDIA_SYNC_ARCHIVE_DIR: /data/archive
      MEDIA_SYNC_EXPORT_DIR: /data/library
      MEDIA_SYNC_JOB_DIR: /data/jobs
      MEDIA_SYNC_MEDIACRAWLER_PYTHON_EXECUTABLE: /opt/mediacrawler-venv/bin/python
      MEDIA_SYNC_MEDIACRAWLER_RUNTIME_DIR: /data/mediacrawler
      MEDIA_SYNC_MEDIACRAWLER_LOCK_PATH: /app/upstreams.lock.json
    entrypoint: ["/usr/local/bin/media-sync-entrypoint"]
    command: >-
      scheduler supervise --enable-mediacrawler --accept-mediacrawler-license
      --idle-interval-seconds 30
    profiles: ["supervisor"]

volumes:
  media-sync-data:
